<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工打卡系統</title>
    <!-- 引入 LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f4; }
        #clockInBtn {
            background-color: #00B900; color: white; border: none;
            padding: 15px 40px; font-size: 20px; border-radius: 8px;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #clockInBtn:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 20px; color: #333; font-size: 16px; }
    </style>
</head>
<body>

    <h2>出勤打卡</h2>
    <button id="clockInBtn" disabled>系統載入中...</button>
    <div id="status">正在初始化 LINE 環境...</div>

    <script>
        // 填寫您的 LIFF ID
        const myLiffId = "2011911770-ByTrOOIU"; 
        
        // 未來第三階段完成 GAS 部署後，將 Webhook 網址貼到這裡
        const gasWebhookUrl = "YOUR_GAS_WEBHOOK_URL"; 

        const btn = document.getElementById('clockInBtn');
        const statusDiv = document.getElementById('status');

        // 1. 初始化 LIFF
        async function initializeLiff() {
            try {
                await liff.init({ liffId: myLiffId });
                if (!liff.isLoggedIn()) {
                    liff.login(); // 若未登入則引導登入
                } else {
                    btn.innerText = "點擊打卡";
                    btn.disabled = false;
                    statusDiv.innerText = "環境準備就緒，可進行打卡。";
                }
            } catch (err) {
                statusDiv.innerText = "LIFF 初始化失敗：" + err.message;
            }
        }

        // 2. 獲取公網 IP
        async function getPublicIp() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch (err) {
                return "unknown"; // 容錯處理，避免抓不到 IP 整個卡死
            }
        }

        // 3. 獲取 GPS 座標
        function getGpsCoords() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject("您的裝置不支援地理位置功能。");
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => resolve({ lat: position.coords.latitude, lng: position.coords.longitude }),
                    (error) => reject("請開啟手機 GPS 定位權限。"),
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 } // 強制高精度無快取
                );
            });
        }

        // 打卡按鈕點擊事件
        btn.addEventListener('click', async () => {
            btn.disabled = true;
            statusDiv.innerText = "正在取得定位與 IP 資訊...";

            try {
                // 抓取 LINE 使用者資料
                const profile = await liff.getProfile();
                
                // 平行抓取 IP 與 GPS (節省等待時間)
                const [ip, coords] = await Promise.all([getPublicIp(), getGpsCoords()]);

                statusDiv.innerText = "資料讀取完成，正在上傳至雲端...";

                // 打包準備送給 GAS 的 JSON
                const payload = {
                    uid: profile.userId,
                    displayName: profile.displayName,
                    ip: ip,
                    lat: coords.lat,
                    lng: coords.lng
                };

                // 若還沒設定 GAS URL，先在前端印出結果測試
                if (gasWebhookUrl === "YOUR_GAS_WEBHOOK_URL") {
                    statusDiv.innerText = `[測試模式成功] \nName: ${payload.displayName} \nIP: ${payload.ip} \nLat: ${payload.lat}, Lng: ${payload.lng}`;
                    btn.disabled = false;
                    return;
                }

                // 傳送資料到 GAS
                const response = await fetch(gasWebhookUrl, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } // 避開 CORS 預檢請求
                });

                const result = await response.json();
                
                if (result.status === "success") {
                    statusDiv.innerText = "打卡成功！";
                    setTimeout(() => liff.closeWindow(), 2000); // 成功後兩秒自動關閉視窗
                } else {
                    statusDiv.innerText = "打卡失敗：" + result.message;
                    btn.disabled = false;
                }

            } catch (err) {
                statusDiv.innerText = "錯誤：" + err;
                btn.disabled = false;
            }
        });

        // 啟動程式
        initializeLiff();
    </script>
</body>
</html>
